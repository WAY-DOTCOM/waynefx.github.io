<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wask Enterprises | Computer Equipment Catalog</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }

        .logo-area p {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .cart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .cart-btn:hover {
            background-color: var(--primary-dark);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-bar, .filter-select {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            background: var(--surface);
        }

        .search-bar {
            flex: 1;
            min-width: 250px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .product-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
        }

        .product-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin: 1rem 0;
        }

        .add-to-cart {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 0.5rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
        }

        .add-to-cart:hover {
            background-color: var(--primary);
            color: white;
        }

        /* Cart Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-total {
            margin-top: 1.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: right;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>Wask Enterprises</h1>
            <p>Computer Equipment & IT Solutions</p>
        </div>
        <button class="cart-btn" onclick="toggleCart()">Cart (<span id="cart-count">0</span>)</button>
    </header>

    <main>
        <div class="controls">
            <input type="text" id="search-input" class="search-bar" placeholder="Search computer equipment..." oninput="filterProducts()">
            <select id="category-filter" class="filter-select" onchange="filterProducts()">
                <option value="all">All Categories</option>
                <option value="Laptops">Laptops</option>
                <option value="Desktops">Desktops</option>
                <option value="Accessories">Accessories</option>
            </select>
        </div>

        <div class="product-grid" id="product-grid">
            <!-- Products will be injected dynamically via JavaScript -->
        </div>
    </main>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Shopping Cart</h2>
                <button class="close-btn" onclick="toggleCart()">&times;</button>
            </div>
            <div id="cart-items-container">
                <p>Your cart is empty.</p>
            </div>
            <div class="cart-total" id="cart-total">Total: KES 0</div>
        </div>
    </div>

    <script>
        // Sample Product Catalog
        const products = [
            { id: 1, name: "HP EliteBook 840 G5", category: "Laptops", price: 45000, desc: "Core i5 8th Gen, 16GB RAM, 256GB SSD" },
            { id: 2, name: "Dell Latitude 5490", category: "Laptops", price: 42000, desc: "Core i5, 8GB RAM, 512GB SSD" },
            { id: 3, name: "Lenovo ThinkPad T480", category: "Laptops", price: 48000, desc: "Core i7, 16GB RAM, 512GB SSD" },
            { id: 4, name: "Custom Gaming Desktop", category: "Desktops", price: 85000, desc: "Core i7, RTX 3060, 16GB RAM, 1TB NVMe" },
            { id: 5, name: "HP ProDesk 600 G3 SFF", category: "Desktops", price: 28000, desc: "Core i5 7th Gen, 8GB RAM, 500GB HDD" },
            { id: 6, name: "Logitech Wireless Keyboard & Mouse", category: "Accessories", price: 3500, desc: "Ergonomic design with long battery life" },
            { id: 7, name: "24-Inch Full HD Monitor", category: "Accessories", price: 16500, desc: "IPS Panel, 75Hz, HDMI & VGA ports" },
            { id: 8, name: "External SSD 1TB (SanDisk)", category: "Accessories", price: 12000, desc: "High-speed portable storage solution" }
        ];

        let cart = [];

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-light);">No products found.</p>';
                return;
            }

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-info">
                        <span class="product-category">${product.category}</span>
                        <h3>${product.name}</h3>
                        <p style="font-size: 0.9rem; color: var(--text-light);">${product.desc}</p>
                    </div>
                    <div>
                        <div class="product-price">KES ${product.price.toLocaleString()}</div>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">Add to Cart</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-filter').value;

            const filtered = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search);
                const matchesCategory = category === 'all' || p.category === category;
                return matchesSearch && matchesCategory;
            });

            renderProducts(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = count;

            const container = document.getElementById('cart-items-container');
            if (cart.length === 0) {
                container.innerHTML = '<p style="color: var(--text-light);">Your cart is empty.</p>';
                document.getElementById('cart-total').innerText = 'Total: KES 0';
                return;
            }

            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div>
                        <strong>${item.name}</strong><br>
                        <small style="color: var(--text-light);">KES ${item.price.toLocaleString()} × ${item.quantity}</small>
                    </div>
                    <button onclick="removeFromCart(${item.id})" style="background: none; border: none; color: #ef4444; cursor: pointer;">Remove</button>
                `;
                container.appendChild(div);
            });

            document.getElementById('cart-total').innerText = `Total: KES ${total.toLocaleString()}`;
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        // Initialize Catalog on Load
        renderProducts(products);
    </script>
</body>
</html>----------------------- Page 1-----------------------
